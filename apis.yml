description: Joya Communications Inc. is the consumer software company behind Marco Polo, a video
  chat application for asynchronous, personal video messaging with the people who matter most.
  Marco Polo positions itself as a privacy-first alternative to social media, with no ads, no public
  feeds, and no social engagement metrics, and offers a Marco Polo Plus subscription with premium
  features. Joya Communications is venture-backed (Battery Ventures) and, as a consumer mobile app
  company, does not currently publish a public developer API, OpenAPI specification, SDKs, or
  developer documentation surface.
